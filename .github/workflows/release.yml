name: Verify and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require tag to match VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag mismatch: got ${GITHUB_REF_NAME}, expected ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Verify package integrity and version consistency
        run: python scripts/verify_package.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    name: Publish GitHub Release if needed
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "Release tag mismatch: got ${GITHUB_REF_NAME}, expected ${TAG}" >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            echo "SHOULD_RELEASE=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${GITHUB_REF_TYPE}" != "tag" && "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG} already points to ${TAG_SHA}, not current commit ${GITHUB_SHA}. Refusing to publish mismatched code." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "The Hunter ${TAG}"
            git push origin "${TAG}"
          fi

          echo "SHOULD_RELEASE=true" >> "${GITHUB_ENV}"

      - name: Build release archive from manifest
        if: env.SHOULD_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="dist/RZK-The-Hunter-v${VERSION}"
          ARCHIVE="RZK-The-Hunter-v${VERSION}.zip"

          mkdir -p "${PACKAGE_DIR}"
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            mkdir -p "${PACKAGE_DIR}/$(dirname "${file}")"
            cp "${file}" "${PACKAGE_DIR}/${file}"
          done < manifest.txt

          (cd dist && zip -qr "../${ARCHIVE}" "RZK-The-Hunter-v${VERSION}")
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Publish release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${TAG}" "${ARCHIVE}" \
            --verify-tag \
            --title "The Hunter v${VERSION}" \
            --generate-notes
