name: Verify and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require tag to match VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag mismatch: got ${GITHUB_REF_NAME}, expected ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Verify package integrity and version consistency
        run: python scripts/verify_package.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archive from manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE_DIR="dist/RZK-The-Hunter-v${VERSION}"
          ARCHIVE="RZK-The-Hunter-v${VERSION}.zip"

          mkdir -p "${PACKAGE_DIR}"
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            mkdir -p "${PACKAGE_DIR}/$(dirname "${file}")"
            cp "${file}" "${PACKAGE_DIR}/${file}"
          done < manifest.txt

          (cd dist && zip -qr "../${ARCHIVE}" "RZK-The-Hunter-v${VERSION}")
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
            --verify-tag \
            --title "The Hunter v${VERSION}" \
            --generate-notes
